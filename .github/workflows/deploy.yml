name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: depot-ubuntu-24.04
    environment:
      name: production
      url: https://relay.supaterm.com/
    env:
      SSH_TARGET: ubuntu@13.63.231.197
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make build
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          KNOWN_HOST: 13.63.231.197 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC8UbXV98tfh6AjO8Em+X+nXTVcOUUN1+FoCkzwqK/Td
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Check hand-installed files
        run: |
          check() { ssh -o BatchMode=yes "$SSH_TARGET" "cat $2" | diff -u "deploy/$1" -; }
          check Caddyfile /etc/caddy/Caddyfile
          check nftables.conf /etc/nftables.conf
      - name: Install relay
        run: |
          scp -o BatchMode=yes bin/relay deploy/supaterm-relay.service "$SSH_TARGET:/tmp/"
          ssh -o BatchMode=yes "$SSH_TARGET" 'bash -s' < deploy/install-relay.sh
      - name: Smoke test through the public endpoints
        run: |
          for url in wss://relay.supaterm.com wss://relay.supacode.sh; do
            go run ./e2e/docker/probe -mode smoke -url wss://relay.supaterm.com -client-url "$url" -n 6
          done
          go run ./e2e/docker/probe -mode tunnel -url wss://relay.supaterm.com -n 4
