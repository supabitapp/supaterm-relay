name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy (${{ matrix.relay }})
    needs: ci
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - relay: relay.supaterm.com
            ssh-target: supaterm-relay.exe.xyz
            ssh-key: EXE_SSH_KEY
            known-host: supaterm-relay.exe.xyz ssh-rsa 
            origin-url: wss://supaterm-relay.exe.xyz
          - relay: relay2.supaterm.com
            ssh-target: ubuntu@13.63.231.197
            ssh-key: RELAY2_SSH_KEY
            known-host: 13.63.231.197 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC8UbXV98tfh6AjO8Em+X+nXTVcOUUN1+FoCkzwqK/Td
    environment:
      name: production
      url: https://${{ matrix.relay }}/
    env:
      PUBLIC_RELAY_URL: wss://${{ matrix.relay }}
      SSH_TARGET: ${{ matrix.ssh-target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make build
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets[matrix.ssh-key] }}
          KNOWN_HOST: ${{ matrix.known-host }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Check relay2's hand-installed files
        if: matrix.relay == 'relay2.supaterm.com'
        run: |
          check() { ssh -o BatchMode=yes "$SSH_TARGET" "cat $2" | diff -u "deploy/relay2/$1" -; }
          check Caddyfile /etc/caddy/Caddyfile
          check nftables.conf /etc/nftables.conf
          check memory.conf /etc/systemd/system/supaterm-relay.service.d/memory.conf
      - name: Install relay
        run: |
          scp -o BatchMode=yes bin/relay deploy/supaterm-relay.service "$SSH_TARGET:/tmp/"
          ssh -o BatchMode=yes "$SSH_TARGET" 'bash -s' < deploy/install-relay.sh
      - name: Smoke test through the public endpoint
        run: |
          go run ./e2e/docker/probe -mode smoke -url "$PUBLIC_RELAY_URL" -n 6
          go run ./e2e/docker/probe -mode tunnel -url "$PUBLIC_RELAY_URL" -n 4
      - name: Smoke test the origin directly
        if: matrix.origin-url
        env:
          ORIGIN_URL: ${{ matrix.origin-url }}
        run: go run ./e2e/docker/probe -mode smoke -url "$ORIGIN_URL" -n 6
